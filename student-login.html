<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Task Karate School</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="assets/styles/base.css">
  <link rel="stylesheet" href="assets/styles/partials/navigation-bar-modern.css">
  <link rel="stylesheet" href="assets/styles/universal-enhancements.css">
  <link rel="stylesheet" href="assets/styles/student-login.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
  <!-- Decorative Background -->
  <div class="bg-geo" aria-hidden="true"></div>

  <!-- Header (partial) -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main class="login-container">
    
    <!-- Login Card -->
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <h1>Student Login</h1>
        <p>Enter your 4-digit PIN to access your dashboard</p>
      </div>
      
      <form id="loginForm" class="login-form">
        <div class="pin-input-container">
          <input type="password" 
                 class="pin-digit" 
                 id="pin1" 
                 maxlength="1" 
                 pattern="[0-9]" 
                 inputmode="numeric"
                 autocomplete="off"
                 required>
          <input type="password" 
                 class="pin-digit" 
                 id="pin2" 
                 maxlength="1" 
                 pattern="[0-9]" 
                 inputmode="numeric"
                 autocomplete="off"
                 required>
          <input type="password" 
                 class="pin-digit" 
                 id="pin3" 
                 maxlength="1" 
                 pattern="[0-9]" 
                 inputmode="numeric"
                 autocomplete="off"
                 required>
          <input type="password" 
                 class="pin-digit" 
                 id="pin4" 
                 maxlength="1" 
                 pattern="[0-9]" 
                 inputmode="numeric"
                 autocomplete="off"
                 required>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        
        <button type="submit" class="btn-login">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 17l5-5-1.41-1.41L13 13.17V3h-2v10.17l-2.59-2.58L7 12l5 5zm-6 2h12v2H6v-2z"/>
          </svg>
          Login
        </button>
      </form>
      
      <div class="login-help">
        <p>Forgot your PIN? Contact your instructor or parent.</p>
        <p>Don't have a PIN yet? Your instructor will set one up for you.</p>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="assets/scripts/partials.js"></script>
  <script src="assets/scripts/base.js"></script>
  <script src="assets/scripts/student-login.js"></script>
</body>
</html>
